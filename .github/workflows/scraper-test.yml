name: Scraper test

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run unit tests
      run: |
        make test
    # Spiders are registered and importable. This deliberately does NOT crawl:
    # afx.kwayisi.org refuses connections from every runner, so the previous live
    # `scrapy crawl afx_scraper` spent ~9 minutes timing out on every push while
    # proving nothing. Real crawl health is measured by the data-quality gate in
    # scripts/run_daily_job.sh, which reports item counts per run.
    - name: Check spiders are loadable
      run: |
        export DB_BACKEND=sqlite
        export SQLITE_DB_PATH=data/nse_scraper.sqlite3
        scrapy list

